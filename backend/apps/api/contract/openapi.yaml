        hours: { type: [string, 'null'], example: 'Dushanba, 15:00–17:00' }
        phone: { type: [string, 'null'] }
        ext: { type: [string, 'null'], description: Ichki raqam }
        email: { type: [string, 'null'] }

    Leadership:
      type: object
      required: [rector, prorectors]
      properties:
        rector: { $ref: '#/components/schemas/Leader' }
        prorectors: { type: array, items: { $ref: '#/components/schemas/Leader' } }
        press: { oneOf: [{ $ref: '#/components/schemas/Leader' }, { type: 'null' }] }

    DocumentItem:
      type: object
      required: [id, category, title, url, kind]
      properties:
        id: { type: string }
        category: { type: string, description: 'DocumentList.categories[].id' }
        title: { type: string }
        url: { type: string }
        kind: { type: string, enum: [pdf, link] }
        meta: { type: [string, 'null'] }
        display: { type: [string, 'null'], enum: [embed, open, download, link, null], description: 'PDF ko‘rinishi (Attachment.display bilan bir xil)' }
        height: { type: [integer, 'null'] }

    DocumentList:
      type: object
      required: [categories, items]
      properties:
        categories:
          type: array
          items: { type: object, required: [id, title], properties: { id: { type: string }, title: { type: string } } }
        items: { type: array, items: { $ref: '#/components/schemas/DocumentItem' } }

    Program:
      type: object
      required: [id, code, title, group, form, years]
      properties:
        id: { type: string }
        code: { type: string, example: '60230100' }
        title: { type: string }
        language: { oneOf: [{ $ref: '#/components/schemas/TaughtLanguage' }, { type: 'null' }], description: O'qitiladigan til (yo'q bo'lsa — o'zbek tilida) }
        group: { type: string, description: 'ProgramList.groups[].id' }
        form: { type: string, example: Kunduzgi }
        years: { type: integer }

    ProgramList:
      type: object
      required: [level, groups, items]
      properties:
        level: { type: string, enum: [bachelor, master] }
        groups:
          type: array
          items: { type: object, required: [id, title], properties: { id: { type: string }, title: { type: string } } }
        items: { type: array, items: { $ref: '#/components/schemas/Program' } }

    FacultySummary:
      type: object
      required: [id, slug, name, departments, programs]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        logo: { type: [string, 'null'], format: uri }
        departments: { type: integer }
        programs: { type: integer }

    FacultyList:
      type: object
      required: [items, summary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FacultySummary' } }
        summary:
          type: object
          required: [faculties, departments]
          properties: { faculties: { type: integer }, departments: { type: integer } }

    FacultyPerson:
      type: object
      required: [name, role]
      properties:
        staffId: { type: [string, 'null'] }
        name: { type: string }
        role: { type: string }
        degree: { type: [string, 'null'], description: 'Ilmiy daraja, unvon' }
        photo: { type: [string, 'null'], format: uri }

    FacultyProgram:
      type: object
      required: [code, title, level, form, years]
      properties:
        code: { type: string }
        title: { type: string }
        level: { type: string, enum: [bachelor, master, phd] }
        form: { type: string }
        years: { type: integer }

    FacultyDetail:
      type: object
      required: [id, slug, name, number, about, stats, dean, programs, departments, deanery, news, contact]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        logo: { type: [string, 'null'], format: uri }
        number: { type: integer, description: Tartib raqami }
        about: { type: string }
        stats:
          type: object
          description: HEMIS'dan
          required: [students, departments, programs, teachers]
          properties: { students: { type: integer }, departments: { type: integer }, programs: { type: integer }, teachers: { type: integer } }
        dean:
          type: object
          description: FacultyPerson + qabul kunlari va aloqa
          required: [name, role]
          properties:
            staffId: { type: [string, 'null'] }
            name: { type: string }
            role: { type: string }
            degree: { type: [string, 'null'] }
            photo: { type: [string, 'null'], format: uri }
            hours: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        programs: { type: array, items: { $ref: '#/components/schemas/FacultyProgram' } }
        departments:
          type: array
          items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, head: { type: [string, 'null'] } } }
        deanery: { type: array, items: { $ref: '#/components/schemas/FacultyPerson' } }
        news: { type: array, items: { $ref: '#/components/schemas/PostSummary' } }
        contact:
          type: object
          required: [address, phone]
          properties: { address: { type: string }, phone: { type: string }, email: { type: [string, 'null'] }, mapUrl: { type: [string, 'null'], format: uri } }

    Admission:
      type: object
      required: [year, applyUrl, dates, programs, documents, faq, contact]
      properties:
        year: { type: string, example: 2026/2027 }
        applyUrl: { type: string, format: uri }
        dates:
          type: array
          items: { type: object, required: [title, period], properties: { title: { type: string }, period: { type: string }, current: { type: boolean } } }
        programs:
          type: array
          items:
            type: object
            required: [id, code, title, faculty, level, form, years]
            properties:
              id: { type: string }
              code: { type: string }
              title: { type: string }
              faculty: { type: string }
              level: { type: string, enum: [bachelor, master, phd] }
              form: { type: string }
              years: { type: integer }
              price: { type: [string, 'null'], example: '16 500 000 so‘m' }
        documents: { type: array, items: { type: string } }
        documentsUrl: { type: [string, 'null'], format: uri }
        faq:
          type: array
          items: { type: object, required: [q, a], properties: { q: { type: string }, a: { type: string } } }
        contact:
          type: object
          required: [address, hours, phone, telegram]
          properties: { address: { type: string }, hours: { type: string }, phone: { type: string }, telegram: { type: string, format: uri } }

    RankValue:
      type: object
      required: [rank]
      properties:
        rank: { type: string, example: '#512' }
        change: { type: [integer, 'null'], example: 57, description: O'tgan yilga nisbatan ko'tarilish }

    SdgGoalSummary:
      type: object
      required: [n, url, title]
      properties:
        n: { type: integer, minimum: 1, maximum: 17 }
        url: { type: string, example: /brm-6-toza-suv-va-sanitariya }
        title: { type: string }
        rank: { type: [string, 'null'], example: 401–600, description: "THE Impact o'rni; ishtirok etmagan bo'lsa null" }
        score: { type: [string, 'null'], example: '43.5' }

    SdgOverview:
      type: object
      required: [greenmetric, categories, goals, impactYear, reports, education, news]
      properties:
        greenmetric:
          type: object
          required: [year, world, asia, country]
          properties:
            year: { type: integer, example: 2026 }
            world: { $ref: '#/components/schemas/RankValue' }
            asia: { $ref: '#/components/schemas/RankValue' }
            country: { $ref: '#/components/schemas/RankValue' }
            highlight:
              type: [object, 'null']
              required: [text, url]
              properties: { text: { type: string }, url: { type: string } }
        categories:
          type: array
          description: GreenMetric 6 yo'nalishi
          items:
            type: object
            required: [code, title, subtitle, url]
            properties: { code: { type: string, example: WR }, title: { type: string }, subtitle: { type: string, example: Water }, badge: { type: [string, 'null'] }, url: { type: string } }
        goals: { type: array, items: { $ref: '#/components/schemas/SdgGoalSummary' }, description: '17 ta, 1 dan 17 gacha' }
        impactYear: { type: integer, example: 2025 }
        reports: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        education:
          type: object
          required: [title, text, tags, url]
          properties: { title: { type: string }, text: { type: string }, tags: { type: array, items: { type: string } }, url: { type: string } }
        news: { type: array, items: { $ref: '#/components/schemas/PostSummary' } }

    SdgGoal:
      description: SdgGoalSummary maydonlari + sahifa mazmuni
      type: object
      required: [n, url, title, subtitle, sections, documents]
      properties:
        n: { type: integer, minimum: 1, maximum: 17 }
        url: { type: string }
        title: { type: string }
        rank: { type: [string, 'null'] }
        score: { type: [string, 'null'] }
        subtitle: { type: string, description: BMT maqsadi ta'rifi }
        highlight:
          type: [object, 'null']
          required: [label, value]
          properties: { label: { type: string, example: GreenMetric 2026 · Water }, value: { type: string } }
        sections:
          type: array
          description: Ichki bo'limlar (tablar); body — HTML
          items:
            type: object
            required: [id, title, body, images]
            properties: { id: { type: string }, title: { type: string }, body: { type: string }, images: { type: array, items: { type: string, format: uri } } }
        documents: { type: array, items: { $ref: '#/components/schemas/Attachment' } }

    VideoList:
      type: object
      required: [live, channelUrl, categories, items]
      properties:
        live:
          type: object
          required: [isLive, url]
          properties:
            isLive: { type: boolean }
            url: { type: string, format: uri }
            next:
              type: [object, 'null']
              required: [title, startsAt]
              properties: { title: { type: string }, startsAt: { type: string, format: date-time } }
        channelUrl: { type: string, format: uri }
        categories:
          type: array
          items:
            type: object
            required: [id, title, greeting, lang]
            properties: { id: { type: string }, title: { type: string }, greeting: { type: string, example: Hello }, lang: { type: string, example: en } }
        items:
          type: array
          items:
            type: object
            required: [id, category, title, url]
            properties:
              id: { type: string }
              category: { type: string }
              title: { type: string }
              teacher: { type: [string, 'null'] }
              duration: { type: [string, 'null'], example: '12:40' }
              url: { type: string, format: uri }
              thumbnail: { type: [string, 'null'], format: uri }

    ContactPage:
      type: object
      required: [hotline, emails, campuses, leaders, reception, recipients]
      properties:
        hotline:
          type: object
          required: [phone]
          properties: { phone: { type: string }, ext: { type: [string, 'null'] } }
        emails:
          type: array
          items: { type: object, required: [title, value, extra], properties: { title: { type: string }, value: { type: string }, extra: { type: array, items: { type: string } } } }
        campuses:
          type: array
          items:
            type: object
            required: [id, name, address, phone, mapUrl]
            properties:
              id: { type: string }
              name: { type: string }
              address: { type: string }
              phone: { type: string }
              email: { type: [string, 'null'], description: Bino e-pochtasi (bo'lmasa — saytning umumiy e-pochtasi) }
              mapUrl: { type: string, format: uri, description: «Xaritada ochish» havolasi }
              mapEmbed: { type: string, format: uri, description: Sahifadagi kichik xarita (iframe) — admin panelda kiritilgan koordinata bo'yicha, bo'lmasa manzil bo'yicha }
        leaders:
          type: array
          items: { type: object, required: [name, role, ext, phone], properties: { name: { type: string }, role: { type: string }, ext: { type: string }, phone: { type: string } } }
        reception: { type: string }
        recipients:
          type: array
          items: { type: object, required: [id, title], properties: { id: { type: string }, title: { type: string } } }

    AppealResult:
      type: object
      required: [number]
      properties:
        number: { type: string, example: VQ-2026-00125 }

    SearchKind:
      type: string
      enum: [pages, news, documents]

    SearchResults:
      type: object
      required: [q, counts, items, total, page, perPage]
      properties:
        q: { type: string }
        counts:
          type: object
          required: [pages, news, documents]
          properties: { pages: { type: integer }, news: { type: integer }, documents: { type: integer } }
        quick:
          type: [object, 'null']
          required: [title, text, url]
          properties: { title: { type: string }, text: { type: string }, url: { type: string } }
        items:
          type: array
          items:
            type: object
            required: [kind, title, url, meta]
            properties:
              kind: { $ref: '#/components/schemas/SearchKind' }
              title: { type: string }
              url: { type: string }
              excerpt: { type: [string, 'null'], description: Oddiy matn (HTML emas) }
              meta: { type: string }
              date: { type: [string, 'null'], format: date }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
