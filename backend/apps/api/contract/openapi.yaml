openapi: 3.1.0
info:
  title: UzSWLU sayti — backend API
  version: 1.0.0
  description: |
    Yangi uzswlu.uz frontendi (Nuxt) kutayotgan API shartnomasi.
    Frontenddagi manba: `shared/types/api.ts` — shu fayl bilan bir xil bo'lishi kerak.

    **Umumiy qoidalar**
    - Barcha endpointlar `lang` parametrini qabul qiladi va matnli maydonlarni shu tilda qaytaradi.
      Tarjima bo'lmasa — o'zbekcha (`uz`) matn qaytariladi, maydon bo'sh qolmaydi.
    - Rasm/logo maydonlari — **to'liq URL** (`https://...`), chunki frontend boshqa domenda ishlaydi.
    - Sanalar ISO 8601 formatida. Vaqtli maydonlar vaqt mintaqasi bilan: `2026-11-07T10:00:00+05:00`.
    - `id` — satr (string), raqamli ID bo'lsa ham satr qilib yuboriladi.
    - Frontend so'rovni o'z serveridan yuboradi (brauzer emas) va javobni keshlaydi:
      `/home` — 5 daqiqa, `/site` — 1 soat, ichki sahifalar — 5 daqiqa, ro'yxatlar — 1 daqiqa, `/search` — keshlanmaydi.
    - Autentifikatsiya: `Authorization: Bearer <token>` (frontend serverida `NUXT_API_TOKEN`).
servers:
  - url: https://api.uzswlu.uz
    description: Namuna manzil — haqiqiysini backend belgilaydi (frontendda `NUXT_API_BASE`)
security:
  - bearerAuth: []

paths:
  /home:
    get:
      summary: Bosh sahifa uchun barcha ma'lumot
      description: |
        Bitta so'rovda bosh sahifaning hamma bloklari.
        `stats` HEMIS'dan olinadi — backend HEMIS javobini o'zi keshlashi tavsiya etiladi (masalan, soatiga bir marta yangilash).
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeData'
  /site:
    get:
      summary: Har bir sahifada kerak bo'ladigan umumiy ma'lumot (yuqori panel, footer)
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteData'
  /staff:
    get:
      summary: Xodimlar ro'yxati (sayt /staff sahifasi)
      description: |
        Ism, surat, bo'lim va lavozim HEMIS'dan. Qidiruv ism bo'yicha, katta-kichik harf va
        tutuq belgilari (‘ ’ ') farqisiz: `yo'ldoshev` → "Yo‘ldoshev".
        Bir xodim bir necha bo'limda bo'lsa, ro'yxatda bir marta chiqadi (asosiy bo'limi bilan),
        lekin har bir bo'lim filtrida topiladi. Frontend keshi: 1 daqiqa.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Ism bo'yicha qidiruv }
        - { name: department, in: query, required: false, schema: { type: string }, description: Bo'lim ID'si (StaffDepartment.id) }
        - { name: group, in: query, required: false, schema: { type: string, enum: [all, lead, faculty, chair, unit], default: all } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
  /staff/{id}:
    get:
      summary: Xodim profili (sayt /teacher/{id} sahifasi)
      description: |
        Ism, surat, bo'lim, lavozim — HEMIS'dan. E-pochta, telefon va ijtimoiy tarmoqlarni xodimning o'zi
        saytga kirib, kabinetda (dashboard) qo'shadi va o'zgartiradi — javobda faqat to'ldirilganlari bo'ladi.
        Frontend keshlamaydi: kabinetdagi o'zgarish Staff sahifasida darrov ko'rinishi kerak (HEMIS ma'lumotini backend o'zi keshlasin).
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d+$' }, example: '7731' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
        '404':
          description: Bunday xodim yo'q

  /me:
    get:
      summary: Xodim kabineti (dashboard)
      description: |
        Faqat saytga HEMIS (my.gov) orqali kirgan xodimga — sessiya cookie'si yoki `Authorization` sarlavhasi
        (frontend serveri brauzerdagisini o'zgartirmasdan uzatadi). Kirmagan bo'lsa 401.
        Ism, sharif, tug'ilgan kun, telefon, e-pochta, ish joylari — HEMIS'dan, faqat o'qish.
        Kesh yo'q (shaxsiy ma'lumot).
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCabinet' }
        '401': { description: Kirilmagan }
    patch:
      summary: Kabinetdagi o'zgarishlarni saqlash
      description: |
        Faqat yuborilgan qismlar o'zgaradi. Server tekshiradi: havolalar faqat `https://`, e-pochta formati,
        matn uzunligi (about ≤ 2000, qiymatlar ≤ 300). Bo'sh qiymatlar yuborilmaydi (maydon o'chiriladi).
        O'zgarish darrov ommaviy `/staff/{id}` javobida ko'rinishi kerak (keshni tozalang).
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CabinetPatch' }
      responses:
        '200':
          description: Yangilangan kabinet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCabinet' }
        '401': { description: Kirilmagan }
        '422': { description: Noto'g'ri qiymat }
  /me/avatar:
    post:
      summary: O'z suratini yuklash
      description: |
        JPG, PNG, WEBP, 10 MB gacha; tarkibi tekshiriladi, EXIF bo'yicha aylantiriladi, kvadrat qilib kesiladi (~600 px).
        HEMIS surati o'zgarmaydi — zaxira sifatida saqlanadi; HEMIS orqali qayta kirishda o'z surati ustidan yozilmasligi kerak.
        Yangi surat saytning hamma joyida (Staff, ro'yxat, vizitka, tepadagi avatar) ko'rinadi.
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: OK }
        '422': { description: Fayl turi yoki hajmi noto'g'ri }
    delete:
      summary: O'z suratini olib tashlash (HEMIS suratiga qaytish)
      security: [{ userSession: [] }]
      responses:
        '200': { description: OK }
  /me/documents/{section}:
    parameters:
      - { name: section, in: path, required: true, schema: { $ref: '#/components/schemas/CabinetDocSection' } }
    get:
      summary: Bo'limdagi hujjatlar (yangisi birinchi)
      security: [{ userSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CabinetDocument' }
    post:
      summary: Hujjat yuklash
      description: |
        cv, books, articles — PDF, DOC, DOCX; presentations — PPT, PPTX, PDF; 20 MB gacha, tarkibi ham tekshiriladi.
        videos — fayl emas, `url` (faqat https). title_uz majburiy; title_zh bo'sh bo'lsa ko'rsatishda title_en ishlatiladi.
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title_uz]
              properties:
                file: { type: string, format: binary }
                url: { type: string, format: uri }
                title_uz: { type: string, maxLength: 255 }
                title_ru: { type: string, maxLength: 255 }
                title_en: { type: string, maxLength: 255 }
                title_zh: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Yuklangan hujjat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinetDocument' }
        '422': { description: Fayl/havola yoki nom noto'g'ri }
  /me/documents/{section}/{id}:
    delete:
      summary: Hujjatni butunlay o'chirish (yozuv va fayl) — faqat o'zinikini
      security: [{ userSession: [] }]
      parameters:
        - { name: section, in: path, required: true, schema: { $ref: '#/components/schemas/CabinetDocSection' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Topilmadi yoki boshqa xodimniki }

  # ─── Ichki sahifalar ──────────────────────────────────────────────────────
  /pages/{slug}:
    get:
      summary: Matnli sahifa (Universitet haqida, Tuzilma, Stipendiyalar …)
      description: |
        slug — menyudagi manzil (`/universitet-haqida` → `universitet-haqida`). Menyuda bo'lmagan sahifa — 404.
        Yon menyu va "Oldingi/Keyingi" frontend'da /site menyusidan olinadi. Frontend keshi: 5 daqiqa.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }, example: universitet-haqida }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPage' } } } }
        '404': { description: Sahifa yo'q }
  /posts:
    get:
      summary: Yangiliklar, e'lonlar yoki tadbirlar ro'yxati (/yangiliklar, BRM sahifasidagi faoliyat)
      description: Yangidan eskiga. counts — q, month va sdg filtrlari bilan har bir tur soni (tablar uchun). Frontend keshi — 1 daqiqa.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/PostType' } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Sarlavha va matn bo'yicha qidiruv }
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: '2026-10' }
        - { name: sdg, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 17 }, description: Shu BRM maqsadiga bog'langan postlar }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PostList' } } } }
  /posts/{type}/{slug}:
    get:
      summary: Bitta yangilik / e'lon / tadbir (/news/{slug}, /announcements/{slug}, /events/{slug})
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/PostType' } }
        - { name: slug, in: path, required: true, schema: { type: string }, example: italyan-tili-anjumani }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '404': { description: Topilmadi }
  /events:
    get:
      summary: Tadbirlar taqvimi — bitta oy
      description: month berilmasa — joriy oy (Toshkent vaqti). upcoming — bugundan keyingi 3 ta tadbir.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: '2026-10' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EventMonth' } } } }
  /leadership:
    get:
      summary: Rektorat — rektor, prorektorlar, matbuot kotibi
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Leadership' } } } }
  /documents:
    get:
      summary: Me'yoriy hujjatlar — to'liq ro'yxat (qidiruv va toifa filtri frontend'da)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentList' } } } }
  /programs:
    get:
      summary: Ta'lim yo'nalishlari (/bakalavriat, /magistratura)
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: level, in: query, required: false, schema: { type: string, enum: [bachelor, master], default: bachelor } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramList' } } } }
  /faculties:
    get:
      summary: Fakultetlar ro'yxati (kafedra va yo'nalishlar soni bilan)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FacultyList' } } } }
  /faculties/{slug}:
    get:
      summary: Fakultet sahifasi (/faculty/{slug})
      description: stats, dekan va dekanat — HEMIS'dan.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: slug, in: path, required: true, schema: { type: string }, example: english-philology }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FacultyDetail' } } } }
        '404': { description: Topilmadi }
  /admission:
    get:
      summary: Qabul sahifasi (/qabul-20262027)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Admission' } } } }
  /sdg:
    get:
      summary: BRM bosh sahifasi (/brm) — GreenMetric, THE Impact natijalari, hisobotlar
      description: Aylanadagi qisqa yozuvlar (17 ta) frontend tarjima fayllarida; goals[].title — to'liq nom.
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SdgOverview' } } } }
  /sdg/{n}:
    get:
      summary: BRM maqsad sahifasi (/brm-6-toza-suv-va-sanitariya)
      description: Faoliyat (yangiliklar/tadbirlar/e'lonlar) — alohida, GET /posts?sdg={n} orqali, 10 tadan sahifalab.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 17 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SdgGoal' } } } }
        '404': { description: Topilmadi }
  /videos:
    get:
      summary: Video darsliklar va onlayn translatsiya holati
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VideoList' } } } }
  /contact:
    get:
      summary: Aloqa sahifasi
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContactPage' } } } }
  /appeals:
    post:
      summary: Virtual qabulxona murojaati
      description: |
        Frontend serveri maydonlarni tekshiradi (quyidagi chegaralar) va so'rovni o'zgartirmasdan uzatadi.
        Backend ham tekshirsin, spamdan himoya (rate limit) qilsin va murojaatni ro'yxatga olib, raqam qaytarsin.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, phone, email, recipient, message, consent]
              properties:
                name: { type: string, minLength: 3, maxLength: 200 }
                phone: { type: string, pattern: '^\+?[\d\s()-]{7,20}$' }
                email: { type: string, format: email, maxLength: 200 }
                recipient: { type: string, description: 'ContactPage.recipients[].id' }
                message: { type: string, minLength: 10, maxLength: 5000 }
                consent: { type: string, enum: ['yes'] }
                file: { type: string, format: binary, description: 'Ixtiyoriy: PDF, JPG, PNG, DOC, DOCX — 10 MB gacha' }
      responses:
        '200': { description: Qabul qilindi, content: { application/json: { schema: { $ref: '#/components/schemas/AppealResult' } } } }
        '422': { description: Maydonlar noto'g'ri }
  /search:
    get:
      summary: Sayt bo'yicha qidiruv (/search)
      description: Natijalar keshlanmaydi. excerpt — oddiy matn; topilgan so'zni frontend ajratib ko'rsatadi.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/SearchKind' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResults' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    userSession:
      type: apiKey
      in: cookie
      name: session
      description: HEMIS (my.gov) orqali kirgan xodim sessiyasi — backend o'zi beradi; frontend serveri brauzerdagi cookie/Authorization ni o'zgartirmasdan uzatadi

  parameters:
    Lang:
      name: lang
      in: query
      required: false
      schema:
        type: string
        enum: [uz, ru, en, zh]
        default: uz

  schemas:
    HomeData:
      type: object
      required: [slides, stats, faculties, news, announcements, events, languages, partners, updatedAt]
      properties:
        slides:
          type: array
          description: Bosh sahifa karuseli, ko'rsatish tartibida (faqat faol bannerlar)
          items: { $ref: '#/components/schemas/Slide' }
        stats:
          type: array
          description: To'rtala `key` ham bo'lishi kerak
          items: { $ref: '#/components/schemas/Stat' }
        faculties:
          type: array
          description: Barcha fakultetlar, ko'rsatish tartibida
          items: { $ref: '#/components/schemas/Faculty' }
        news:
          type: array
          description: Oxirgi 4 ta yangilik, yangisi birinchi (birinchisi katta kartada chiqadi)
          maxItems: 4
          items: { $ref: '#/components/schemas/NewsItem' }
        announcements:
          type: array
          description: Oxirgi 4 ta e'lon, yangisi birinchi
          maxItems: 4
          items: { $ref: '#/components/schemas/Announcement' }
        events:
          type: array
          description: Hali boshlanmagan eng yaqin 3 ta tadbir, `startsAt` bo'yicha o'sish tartibida. Bo'lmasa — bo'sh massiv
          maxItems: 3
          items: { $ref: '#/components/schemas/EventItem' }
        languages:
          type: array
          description: Universitetda o'qitiladigan tillar
          items: { $ref: '#/components/schemas/TaughtLanguage' }
        partners:
          type: array
          items: { $ref: '#/components/schemas/Partner' }
        banner:
          description: Bayram banneri («Biz bilan bog'lanish» va «Davlat ramzlari» orasida) — admin panelda bitta rasm; yashirilgan yoki rasmi yo'q bo'lsa null
          oneOf:
            - type: 'null'
            - type: object
              required: [image, alt]
              properties:
                image: { type: string, format: uri }
                alt: { type: string, description: Rasm tavsifi (bo'sh bo'lishi mumkin) }
                link: { type: [string, 'null'], description: Bosilganda ochiladigan sahifa (/... yoki https://...) }
        updatedAt:
          type: string
          format: date-time
          description: HEMIS ma'lumotlari oxirgi marta yangilangan vaqt
          example: '2026-10-21T10:04:00+05:00'

    Slide:
      type: object
      required: [id, image, alt]
      properties:
        id: { type: string, example: '1' }
        image:
          type: string
          format: uri
          description: |
            Banner rasmi. **Nisbati 16:9 bo'lishi shart** (1920×1080), WebP/JPEG, 500 KB dan kam.
            Karusel aynan 16:9 o'lchamda, shuning uchun bunday banner chetdan chetgacha to'liq ko'rinadi.
            Boshqa nisbatdagi rasm qirqilmaydi, lekin chetlarida xira fon chiqadi — admin panelda yuklashda 16:9 ni tekshirish tavsiya etiladi.
          example: https://uzswlu.uz/uploads/slides/greenmetric-2026.webp
        alt:
          type: string
          description: Rasm mazmuni (ekran o'quvchilar uchun), so'ralgan tilda
          example: 'UI GreenMetric 2026: dunyoda 512-, Osiyoda 296-, O‘zbekistonda 11-o‘rin'
        link:
          type: [string, 'null']
          description: Bosilganda ochiladigan sahifa (ixtiyoriy)
          example: /news/greenmetric-2026

    Stat:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          enum: [faculties, staff, departments, students]
        value:
          type: integer
          description: Aniq son. Frontend o'zi qisqartiradi (17384 → "17K+", 1137 → "1100+")
          example: 17384

    Faculty:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, example: '1' }
        slug: { type: string, example: english-philology }
        name: { type: string, example: Ingliz filologiyasi fakulteti }
        logo:
          type: [string, 'null']
          format: uri
          description: Kvadrat logo, kamida 240×240
          example: https://uzswlu.uz/uploads/faculty/english-philology.webp

    NewsItem:
      type: object
      required: [id, slug, title, category, date]
      properties:
        id: { type: string, example: '154' }
        slug:
          type: string
          description: Yangilik manzili `/news/<slug>` — hozirgi saytdagi bilan bir xil bo'lsin (eski havolalar saqlanadi)
          example: ozdjtuda-italyan-tilini-oqitishning-dolzarb-masalalariga-bagishlangan-xalqaro-anjuman-bolib-otdi-1792170691
        title: { type: string, example: '“Tilim — faxrim, g‘ururim va iftixorim!”' }
        category: { type: string, example: Ma’naviyat }
        date: { type: string, format: date, example: '2026-10-20' }
        image:
          type: [string, 'null']
          format: uri
          description: Muqova rasmi (bo'lmasa, frontend bezak muqova chizadi)
        sdg:
          type: [integer, 'null']
          minimum: 1
          maximum: 17
