        campuses:
          type: array
          items: { $ref: '#/components/schemas/Campus' }
        socials:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        symbols:
          type: array
          nullable: true
          description: Davlat ramzlari (bosh sahifa bloki va footer) — admin panelda boshqariladi; berilmasa saytdagi standart havolalar
          items: { $ref: '#/components/schemas/StateSymbol' }

    StateSymbol:
      type: object
      description: Davlat ramzi — bayroq, gerb yoki madhiya
      required: [key, title]
      properties:
        key: { type: string, enum: [flag, emblem, anthem] }
        title: { type: string, example: Özbekiston Respublikasi davlat bayroği }
        description: { type: string, nullable: true, description: Qisqa tavsif (ixtiyoriy) }
        image: { type: string, format: uri, nullable: true }
        audio: { type: string, format: uri, nullable: true, description: Madhiya audio fayli (MP3) }
        href: { type: string, format: uri, nullable: true, description: Rasmiy manba sahifasi (archive.uz, YouTube) }
        source: { type: string, nullable: true, example: archive.uz }

    MenuGroup:
      type: object
      required: [id, title, links]
      properties:
        id:
          type: string
          description: Barqaror kalit (frontend ikonkani shunga qarab tanlaydi)
          enum: [university, applicants, activity, news, sdg, programs, video, contact]
          example: applicants
        title: { type: string, example: Abituriyentlar }
        description: { type: [string, 'null'], example: 'Qabul, yo‘nalishlar, kontrakt va grantlar — kerakli hamma narsa.' }
        url:
          type: [string, 'null']
          description: Bitta sahifali bo'lim (Yangiliklar, Aloqa) — ochiladigan menyu o'rniga to'g'ridan-to'g'ri havola; bunda `links` bo'sh
          example: null
        overview: { type: [string, 'null'], description: "Bo'limning umumiy sahifasi (BRM → /brm) — mega-menyuda nom va belgi shu sahifaga havola", example: /brm }
        links:
          type: array
          items: { $ref: '#/components/schemas/MenuLink' }

    MenuLink:
      type: object
      required: [title, url]
      properties:
        title: { type: string, example: Qabul – 2026/2027 }
        url:
          type: string
          description: Ichki yo'l (tilsiz, masalan `/qabul-20262027` — hozirgi sayt manzillari saqlangan) yoki to'liq URL (PDF, tashqi sayt)
          example: /qabul-20262027
        file: { type: [string, 'null'], enum: [pdf, null], description: Fayl bo'lsa — yonida belgi chiqadi }
        highlight: { type: boolean, description: Ajratib ko'rsatish (mega-menyuda alohida karta), example: true }
        sdg: { type: [integer, 'null'], minimum: 1, maximum: 17, description: 'BRM bo''limi: BMT maqsadi raqami — rangli plitka bo''lib chiqadi' }

    Campus:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, example: main }
        name: { type: string, example: Bosh bino }
        address: { type: string, example: 'Toshkent sh., Kichik halqa yo‘li ko‘chasi, G9-A, 21-uy' }

    SocialLink:
      type: object
      required: [network, url]
      properties:
        network:
          type: string
          enum: [telegram, instagram, facebook, youtube, x]
        url: { type: string, format: uri, example: https://t.me/UzSWLU }

    StaffDepartment:
      type: object
      required: [id, name, group, count]
      properties:
        id: { type: string, example: pedagogika-va-psixologiya-kafedrasi }
        name: { type: string, example: Pedagogika va psixologiya kafedrasi }
        group: { $ref: '#/components/schemas/StaffGroup' }
        count: { type: integer, description: Bo'limdagi xodimlar soni, example: 24 }

    StaffGroup:
      type: string
      enum: [lead, faculty, chair, unit]
      description: 'lead — rahbariyat, faculty — fakultet (dekanat, tyutorlar), chair — kafedra, unit — markaz va bo''limlar'

    HemisRef:
      type: object
      description: HEMIS kod + nom juftligi (staffPosition, employmentForm, employeeStatus, employeeType) — HEMIS javobidagidek
      required: [code, name]
      properties:
        code: { type: string, example: '15' }
        name: { type: string, example: Professor }

    HemisEmployment:
      type: object
      description: |
        Xodimning bitta ish joyi — HEMIS'dagi bitta qator, o'zgartirmasdan va HEMIS tartibida.
        Frontend oldingi saytdagi qoidalarni o'zi qo'llaydi: status 14 (ishdan bo'shagan) ko'rsatilmaydi;
        lavozimlarda avval boshqaruv/asosiy lavozim, keyin o'qituvchilik lavozimlari (kod 11–15); bo'limlar shu tartibda.
      required: [department, position]
      properties:
        department:
          type: object
          required: [id, name]
          properties:
            id: { type: string, example: rahbariyat }
            name: { type: string, example: Rahbariyat }
        position:
          allOf: [{ $ref: '#/components/schemas/HemisRef' }]
          description: 'HEMIS staffPosition. Kod 11–15 — o''qituvchilik lavozimlari (Stajer-o''qituvchi … Professor); HEMIS''da alohida "unvon" maydoni yo''q'
        form:
          description: 'HEMIS employmentForm: "Asosiy ish joy", "O''rindoshlik (ichki-asosiy)" …'
          oneOf: [{ $ref: '#/components/schemas/HemisRef' }, { type: 'null' }]
        rate: { type: [number, 'null'], description: Stavka, example: 1 }
        status:
          description: HEMIS employeeStatus. Kod 14 — ishdan bo'shagan
          oneOf: [{ $ref: '#/components/schemas/HemisRef' }, { type: 'null' }]
        type:
          description: HEMIS employeeType. Kod 10 — "Boshqa" (dashboard'da ko'rsatilmaydi)
          oneOf: [{ $ref: '#/components/schemas/HemisRef' }, { type: 'null' }]

    StaffSummary:
      type: object
      description: Ro'yxat kartasi — HEMIS ma'lumoti (backend HEMIS API'dan oladi va keshlaydi)
      required: [id, name, employments, group]
      properties:
        id: { type: string, description: Saytdagi xodim ID'si (/teacher/7731), example: '7731' }
        name: { type: string, description: 'HEMIS dagi ism, tartibi o''zgarishsiz', example: IBRAGIMOV OTABEK }
        patronymic: { type: [string, 'null'], description: 'HEMIS sharifi. name da bo''lmasa frontend oxiriga qo''shadi; vizitkada alohida qatorda', example: ALISHEROVICH }
        photo: { type: [string, 'null'], format: uri, description: 'Ko''rsatiladigan surat: xodim saytga o''zi yuklagan bo''lsa — o''shasi, aks holda HEMIS surati' }
        photoFallback: { type: [string, 'null'], format: uri, description: 'O''z surati ochilmasa ishlatiladigan HEMIS surati (ikkalasi ham bo''lmasa — bosh harflar)' }
        employments:
          type: array
          description: HEMIS ish joylari, HEMIS tartibida
          items: { $ref: '#/components/schemas/HemisEmployment' }
        group: { $ref: '#/components/schemas/StaffGroup' }

    StaffList:
      type: object
      required: [items, total, page, perPage, groups, departments, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffSummary' }
        total: { type: integer, description: Filtrlangan natijalar soni, example: 1312 }
        page: { type: integer, example: 1 }
        perPage: { type: integer, example: 24 }
        groups:
          type: object
          description: Har bir guruhdagi xodimlar soni — q va department hisobga olinadi, group esa yo'q (filtr tugmalaridagi raqamlar)
          required: [all, lead, faculty, chair, unit]
          properties:
            all: { type: integer, example: 1540 }
            lead: { type: integer, example: 7 }
            faculty: { type: integer, example: 151 }
            chair: { type: integer, example: 1312 }
            unit: { type: integer, example: 178 }
        departments:
          type: array
          description: Bo'lim tanlash ro'yxati, nom bo'yicha tartiblangan
          items: { $ref: '#/components/schemas/StaffDepartment' }
        summary:
          type: object
          description: Filtrsiz umumiy sonlar (sahifa sarlavhasi)
          required: [staff, departments]
          properties:
            staff: { type: integer, example: 1540 }
            departments: { type: integer, example: 95 }

    StaffProfile:
      description: |
        StaffSummary maydonlari (HEMIS) + xodim saytga HEMIS orqali kirib, dashboard'da o'zi kiritgan ma'lumotlar.
        Bo'sh maydonlar/bo'limlar yuborilmaydi — Staff sahifasida umuman chiqmaydi.
      type: object
      required: [id, name, employments, group, contacts, socials, science, documents]
      properties:
        id: { type: string, example: '9300' }
        name: { type: string, example: TUXTASINOV ILXOMJON MADAMINOVICH }
        patronymic: { type: [string, 'null'], example: MADAMINOVICH }
        photo: { type: [string, 'null'], format: uri }
        photoFallback: { type: [string, 'null'], format: uri }
        employments:
          type: array
          items: { $ref: '#/components/schemas/HemisEmployment' }
        group: { $ref: '#/components/schemas/StaffGroup' }
        about:
          type: [string, 'null']
          description: '"Xodim haqida" — so''ralgan tilda (uz/ru/en/zh), tarjima bo''lmasa o''zbekchasi; kiritilmagan bo''lsa null'
          example: Rector, Doctor of Pedagogical Sciences (DSc), Professor
        contacts:
          type: array
          description: 'Aloqa: faqat to''ldirilganlari, ko''rsatish tartibida. E-pochta bir nechta bo''lishi mumkin. office — "Qabul joyi" (manzil; frontend Google Maps qidiruviga havola qiladi)'
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string, enum: [email, telegram, whatsapp, mobile, phone, office] }
              value: { type: string, example: rector@uzswlu.uz }
        socials:
          type: array
          description: Ijtimoiy tarmoqlar — faqat to'ldirilganlari
          items:
            type: object
            required: [network, url]
            properties:
              network: { type: string, enum: [instagram, threads, facebook, linkedin, x, youtube] }
              url: { type: string, format: uri }
        science:
          type: array
          description: Ilmiy profillar — faqat to'ldirilganlari
          items:
            type: object
            required: [network, url]
            properties:
              network: { type: string, enum: [orcid, scholar, scopus, researchgate] }
              url: { type: string, format: uri }
        documents:
          type: array
          description: 'Hujjatlar: faqat xodim "Staff''da ko''rinadi" qoldirgan (boshlanishida ochiq) va bo''sh bo''lmagan bo''limlar. Taqdimotlar va Videolar Staff''da chiqmaydi'
          items:
            type: object
            required: [section, items]
            properties:
              section: { type: string, enum: [cv, books, articles] }
              items:
                type: array
                items:
                  type: object
                  required: [title, url]
                  properties:
                    title: { type: string, description: So'ralgan tildagi nom (uz/ru/en/zh; bo'lmasa o'zbekchasi) }
                    url: { type: string, format: uri }
        cardImage: { type: [string, 'null'], format: uri, description: 'Server yaratgan vizitka rasmi (PNG), ixtiyoriy — bo''lmasa frontend o''zi chizadi' }

    CabinetDocSection:
      type: string
      enum: [cv, books, presentations, articles, videos]
      description: Taqdimotlar va Videolar faqat kabinetda; cv, books, articles — Staff sahifasida ham (xodim yashirmasa)

    LocalizedText:
      type: object
      description: 4 tildagi matn
      required: [uz, ru, en, zh]
      properties:
        uz: { type: string }
        ru: { type: string }
        en: { type: string }
        zh: { type: string }

    CabinetDocument:
      type: object
      required: [id, title, url, createdAt]
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        url: { type: string, description: Fayl havolasi (videolarda — tashqi havola) }
        createdAt: { type: string, format: date-time }

    StaffCabinet:
      type: object
      required: [profile, hemis, about, hasOwnPhoto, documents]
      properties:
        profile: { $ref: '#/components/schemas/StaffProfile' }
        hemis:
          type: object
          description: HEMIS'dan, faqat o'qish
          required: [firstName, lastName]
          properties:
            firstName: { type: string }
            lastName: { type: string }
            patronymic: { type: [string, 'null'] }
            birthDate: { type: [string, 'null'], format: date }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        about: { $ref: '#/components/schemas/LocalizedText' }
        hasOwnPhoto: { type: boolean, description: 'Xodim o''zi yuklagan surat bormi ("✕" faqat shunda chiqadi)' }
        documents:
          type: object
          description: Har bir bo'lim uchun soni va Staff'da ko'rinishi (presentations/videos uchun doim false)
          required: [cv, books, presentations, articles, videos]
          properties:
            cv: { $ref: '#/components/schemas/CabinetDocStat' }
            books: { $ref: '#/components/schemas/CabinetDocStat' }
            presentations: { $ref: '#/components/schemas/CabinetDocStat' }
            articles: { $ref: '#/components/schemas/CabinetDocStat' }
            videos: { $ref: '#/components/schemas/CabinetDocStat' }

    CabinetDocStat:
      type: object
      required: [count, visible]
      properties:
        count: { type: integer }
        visible: { type: boolean }

    CabinetPatch:
      type: object
      description: Faqat o'zgargan qismlar
      properties:
        about: { $ref: '#/components/schemas/LocalizedText' }
        contacts:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string, enum: [email, telegram, whatsapp, mobile, phone, office] }
              value: { type: string, maxLength: 300 }
        socials:
          type: array
          items:
            type: object
            required: [network, url]
            properties:
              network: { type: string, enum: [instagram, threads, facebook, linkedin, x, youtube] }
              url: { type: string, format: uri }
        science:
          type: array
          items:
            type: object
            required: [network, url]
            properties:
              network: { type: string, enum: [orcid, scholar, scopus, researchgate] }
              url: { type: string, format: uri }
        visibility:
          type: object
          description: Staff sahifasida ko'rinishi (boshida hammasi true)
          properties:
            cv: { type: boolean }
            books: { type: boolean }
            articles: { type: boolean }

    # ─── Ichki sahifalar ────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [title, url, kind]
      properties:
        title: { type: string }
        url: { type: string, description: To'liq URL yoki saytdagi ichki manzil ("/sdg-report") }
        kind: { type: string, enum: [pdf, link] }
        meta: { type: [string, 'null'], example: 'PDF · 22.02.2023' }
        display:
          type: [string, 'null']
          enum: [embed, open, download, link, null]
          description: 'PDF ko‘rinishi: embed — ichi ko‘rinadi, open — yangi oynada, download — yuklab olinadi, link — matn ostida faqat nomi (avtoreferat)'
        height: { type: [integer, 'null'], description: 'embed ramkasi balandligi, px' }

    ContentPage:
      type: object
      required: [slug, title, facts, body, timeline, attachments, updatedAt]
      properties:
        slug: { type: string, example: universitet-haqida }
        title: { type: string }
        lead: { type: [string, 'null'] }
        facts:
          type: array
          items: { type: object, required: [value, label], properties: { value: { type: string, example: '23 168' }, label: { type: string, example: talaba } } }
        body:
          type: string
          description: |
            HTML. Ruxsat etilgan teglar: h2, h3, p, ul, ol, li, a, strong, em, blockquote, figure, img, figcaption, table.
            Backend tozalab (sanitize) beradi. `<!-- timeline -->` belgisi bo'lsa — vaqt chizig'i shu joyga qo'yiladi.
            Ichki havolalar tilsiz yoziladi ("/fakultetlar-va-kafedralar") — frontend til prefiksini o'zi qo'shadi.
        timeline:
          type: array
          items: { type: object, required: [label, text], properties: { label: { type: string, example: '1949' }, text: { type: string }, highlight: { type: boolean } } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        updatedAt: { type: string, format: date-time }

    PostType:
      type: string
      enum: [news, announcements, events]

    PostSummary:
      type: object
      required: [id, slug, title, category, date, type]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        date: { type: string, format: date }
        image: { type: [string, 'null'], format: uri }
        type: { $ref: '#/components/schemas/PostType' }
        excerpt: { type: [string, 'null'] }

    PostList:
      type: object
      required: [items, total, page, perPage, counts, months]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PostSummary' } }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
        counts:
          type: object
          required: [news, announcements, events]
          properties: { news: { type: integer }, announcements: { type: integer }, events: { type: integer } }
        months: { type: array, items: { type: string, example: '2026-10' }, description: 'Post bor oylar, yangidan eskiga' }

    Post:
      description: PostSummary maydonlari + to'liq matn
      type: object
      required: [id, slug, title, category, date, type, body, gallery, tags, readingMinutes, related, latest]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        date: { type: string, format: date }
        image: { type: [string, 'null'], format: uri }
        type: { $ref: '#/components/schemas/PostType' }
