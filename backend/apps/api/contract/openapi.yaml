        gallery: { type: array, items: { type: string, format: uri } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: 'Biriktirilgan PDF’lar (dastur, avtoreferat …)' }
        tags: { type: array, items: { type: string } }
        readingMinutes: { type: integer }
        startsAt: { type: [string, 'null'], format: date-time, description: Faqat tadbirlarda }
        endsAt: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'] }
        related: { type: array, items: { $ref: '#/components/schemas/PostSummary' }, description: O'xshash postlar (3 ta) }
        latest: { type: array, items: { $ref: '#/components/schemas/PostSummary' }, description: So'nggi yangiliklar (4 ta) }

