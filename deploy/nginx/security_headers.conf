# HTML sahifalar uchun xavfsizlik sarlavhalari. Har location'da `include` qilinadi: nginx'da location ichidagi `add_header`
# server darajasidagilarni bekor qiladi (meros olinmaydi), shuning uchun alohida fayl.
# Permissions-Policy'da geolocation yo'q: xarita iframe'idagi «mening joyim» tugmasi ishlashi uchun.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
