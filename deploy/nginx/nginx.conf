# nginx asosiy sozlamasi (rasmiy imidjdagi o'rniga). Saytlar — conf.d/default.conf (uzswlu.conf.template dan).
# Yuk sinovi (2026-11-25, 10 000 ta bir vaqtdagi so'rov): sukut `worker_connections 1024` to'lib, ulanishlar javobsiz
# yopilardi («worker_connections are not enough»). Har so'rov nginx ichida 2–3 ulanish band qiladi (mijoz → nginx → ichki
# siqish serveri → Nuxt/backend), shuning uchun chegara katta.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;      # har worker ochiq fayl/ulanish chegarasi (compose `ulimits.nofile` bilan mos)

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept  on;             # bir uyg'onishda navbatdagi hamma yangi ulanishni qabul qiladi (birdan kelgan to'lqinda tezroq)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    # Bufer bilan: har so'rovda diskka yozilmaydi (yuk ostida log ham tor joy bo'lmasin)
    access_log  /var/log/nginx/access.log  main  buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  30;
    keepalive_requests 1000;
    reset_timedout_connection on; # javob bermay qolgan mijoz ulanishi darhol bo'shatiladi (sekin «slowloris» ga qarshi)
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;

    include /etc/nginx/conf.d/*.conf;
}
