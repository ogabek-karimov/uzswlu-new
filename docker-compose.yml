# ÖzDJTU sayti — lokal ishlab chiqish muhiti (Django/DRF backend + Nuxt sayt + Vue admin).
# Barcha xizmatlar kompyuter qayta yonganda o'zi ishga tushadi (restart: unless-stopped).
#   docker compose up -d --build   — ishga tushirish
#   docker compose logs -f backend — jurnal
#   docker compose down            — to'xtatish (baza saqlanadi; bazani ham o'chirish: down -v)
#
# Manzillar (kompyuteringizdan):
#   sayt        http://localhost:3000
#   admin panel http://localhost:5173
#   backend     http://localhost:${BACKEND_PORT:-8000}   (Swagger: /api/docs/)
#
# Port band bo'lsa (ports are not available / forbidden by its access permissions):
#   netstat -ano | findstr ":8000"            — kim band qilgan (PID)
#   tasklist /svc /FI "PID eq <PID>"          — iphlpsvc bo'lsa, bu `netsh portproxy` qoidasi:
#   netsh interface portproxy show all        — qoidalarni ko'rish; o'chirish:
#   netsh interface portproxy delete v4tov4 listenport=8000 listenaddress=0.0.0.0
# Boshqa port kerak bo'lsa, ildiz papkadagi `.env` fayliga (git'ga tushmaydi) masalan:
#   BACKEND_PORT=3001
# yozing va backend/.env da PUBLIC_SERVER_URL=http://localhost:3001 qiling (rasm manzillari shundan quriladi).
# Ildiz `.env` (ixtiyoriy) — compose o'zgaruvchilari: BACKEND_PORT, SITE_PORT, ADMIN_PORT, DB_PORT.
# Frontend sozlamalari (NUXT_API_TOKEN va h.k.) — frontend/.env (frontend/.env.example dan nusxa).
name: uzswlu-drf

x-backend: &backend
  build: ./backend
  image: uzswlu-drf-backend
  env_file: backend/.env
  volumes:
    - ./backend:/app
    # Swagger (/api/docs/) frontend'dagi openapi.yaml shartnomasidan o'qiladi
    - ./frontend/docs:/frontend/docs:ro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Birinchi ishga tushishda migratsiya va namuna ma'lumotlar yuklanadi — shuning uchun start_period uzun
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # HEMIS ma'lumotini har 24 soatda bazaga yangilaydi (HEMIS_API_URL berilmagan bo'lsa hech narsa qilmaydi)
  hemis-sync:
    <<: *backend
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$HEMIS_API_URL" ]; then echo "HEMIS_API_URL bo'sh — sinxronizatsiya o'chirilgan"; exec sleep infinity; fi
        while true; do python manage.py sync_hemis || true; sleep 86400; done
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    env_file:
      - path: frontend/.env
        required: false
    environment:
      # Konteynerlar ichidan backend nomi bilan murojaat qilinadi
      NUXT_API_BASE: http://backend:8000/api
      NUXT_CMS_BASE: http://backend:8000/api/site
      # Windows papkasidan o'zgarishlarni sezish uchun
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    ports:
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite /api/cms so'rovlarini backend'ga yo'naltiradi (cookie bitta manzildan ishlashi uchun)
      BACKEND_URL: http://backend:8000
      # Brauzer rasmlarni va saytni shu manzillardan ochadi (kompyuteringizdagi portlar)
      VITE_MEDIA_BASE: http://localhost:${BACKEND_PORT:-8000}
      VITE_SITE_URL: http://localhost:${SITE_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
  frontend_nuxt:
  admin_node_modules:
