# ÖzDJTU sayti — lokal ishlab chiqish muhiti.
# Barcha xizmatlar kompyuter qayta yonganda o'zi ishga tushadi (restart: unless-stopped).
#   docker compose up -d        — ishga tushirish
#   docker compose logs -f backend
name: uzswlu

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzswlu -d uzswlu"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    env_file: backend/.env
    environment:
      # Windows papkasidan o'zgarishlarni sezish uchun
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_next:/app/.next
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backend_node_modules:
  backend_next:
