# ÖzDJTU sayti — lokal ishlab chiqish muhiti.
# Barcha xizmatlar kompyuter qayta yonganda o'zi ishga tushadi (restart: unless-stopped).
#   docker compose up -d        — ishga tushirish
#   docker compose logs -f backend
# Django/DRF backend — Payload'dagi `uzswlu` loyihasidan alohida (o'z bazasi va portlari), ikkalasi bir vaqtda ishlay oladi.
name: uzswlu-drf

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzswlu -d uzswlu"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
