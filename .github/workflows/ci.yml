name: CI

on:
  push:
    branches: [azik]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django testlari)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]          # /panel/stats faqat PostgreSQL'da ishlaydi — ikkalasida ham sinaymiz
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: uzswlu, POSTGRES_PASSWORD: uzswlu, POSTGRES_DB: uzswlu }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uzswlu" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migratsiyalar modelga mos
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings_test }
      - name: Qo'llanma kodga mos (docs/reference.md, docs/index.html)
        if: matrix.db == 'sqlite'
        run: python manage.py build_docs --check
        env: { DJANGO_SETTINGS_MODULE: config.settings_test }
      - name: Testlar + qamrov
        run: |
          coverage run manage.py test
          coverage report --skip-empty --show-missing --include='apps/*' | tail -40
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://uzswlu:uzswlu@localhost:5432/uzswlu' || '' }}

  frontend:
    name: Frontend (Node testlari + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npx --yes npm@11 ci   # lock fayl npm 11 bilan yaratilgan; Node 22 bilan kelgan npm 10 uni "sinxron emas" deb rad etadi
      - run: npm test               # last-good, media-kesh, SEO yordamchilari, sahifa qoidalari
      - run: npm run build

  admin:
    name: Admin panel (tur tekshiruvi + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm test               # API qatlami (timeout, 401, HTML xato) + manba kodi qoidalari
      - run: npm run build          # vue-tsc --noEmit && vite build

  deploy:
    name: Production tuzilmasi (nginx sintaksisi + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.prod.yml to'g'ri
        run: |
          cp .env.docker.example .env.docker && cp backend/.env.example backend/.env
          EDGE_REFRESH_TOKEN=ci-token docker compose -f docker-compose.prod.yml config -q
      - name: Kalitsiz compose ishga tushmaydi (bo'sh kalit hamma so'rovni keshdan chetlab o'tardi)
        run: "! docker compose -f docker-compose.prod.yml config -q 2>/dev/null"
      - name: nginx sozlamasi (nginx -t)
        run: |
          docker run --rm --add-host frontend:127.0.0.1 --add-host backend:127.0.0.1 \
            -e SITE_HOST=localhost -e API_HOST=api.localhost -e ADMIN_HOST=admin.localhost -e EDGE_REFRESH_TOKEN=ci-token \
            -v "$PWD/deploy/nginx/uzswlu.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine nginx -t

  audit:
    name: Zaif bog'liqliklar (ma'lumot uchun)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm audit --audit-level=high
      - run: cd admin && npm audit --audit-level=high
