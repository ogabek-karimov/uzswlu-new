# VAQTINCHALIK (bir martalik): npm zaifliklarini `npm audit fix` bilan (semver doirasida) yamaydi va lock faylni azik'ga commit qiladi.
# Ishga tushish sharti: faqat azik'da va `.github/audit-fix.trigger` o'zgarganda. Ishlagach shu fayl o'chiriladi.
name: audit-fix-once
on:
  push:
    branches: [azik]
    paths: ['.github/audit-fix.trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm@11 (lock fayl shu versiya bilan yaratilgan)
        run: npm i -g npm@11
      - name: frontend — nuxt 4.6.4 + intlify overrides
        run: |
          cd frontend
          npm install nuxt@4.6.4 --save-exact
          npm audit --audit-level=high || true
          for p in @intlify/core-base @intlify/shared @intlify/message-compiler; do
            v=$(npm view $p version); echo "$p -> $v"
            npm pkg set "overrides.$p=$v"
          done
          npm install
          echo "=== QOLGAN (frontend) ==="; npm audit || true
      - name: build tekshiruvi
        run: |
                    (cd frontend && npm ci && npm test && npm run build)
      - name: commit
        run: |
          git config user.name "audit-fix-once"; git config user.email "noreply@github.com"
          git add frontend/package.json frontend/package-lock.json admin/package.json admin/package-lock.json
          git diff --cached --quiet && { echo "o'zgarish yo'q"; exit 0; }
          git commit -m "npm audit fix: zaif frontend/admin bog'liqliklari semver doirasida yangilandi (CI orqali)"
          git push origin HEAD:azik
